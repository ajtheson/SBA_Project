# ========================================
# QUIZ PRACTICING SYSTEM - Configuration
# ========================================

# Server Configuration
server.port=8080

# Application Name
spring.application.name=quiz-practicing-system

# ========================================
# Database Configuration (SQL Server)
# ========================================
# Using Named Pipes (no TCP/IP required)
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS:1433;databaseName=quiz_practicing_system;encrypt=false
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ========================================
# JWT Configuration
# ========================================
jwt.secret=your-256-bit-secret-key-here-make-it-long-enough-for-security
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ========================================
# File Upload Configuration
# ========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ========================================
# Email Configuration (Gmail SMTP)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================================
# Logging Configuration
# ========================================
logging.level.root=INFO
logging.level.com.quiz=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ========================================
# Swagger/OpenAPI Configuration
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ========================================
# CORS Configuration
# ========================================
cors.allowed-origins=http://localhost:3000,http://localhost:5173
